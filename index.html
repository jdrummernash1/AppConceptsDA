<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Concept Screens Gallery</title>
<style>
  :root {
    --red:#BD252C; --dark:#1A1A1A; --ink:#333333; --muted:#6B7280; --border:#E2E2E2;
    --canvas:#F3F4F6; --paper:#FAFAFA;
  }
  * { box-sizing: border-box; }
  html, body {
    margin:0; padding:0; height:100%;
    background: radial-gradient(circle at 15% 10%, #FFF6F5 0%, var(--paper) 45%, #F1EFEC 100%);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
  }
  .page { max-width: 1100px; margin: 0 auto; padding: 48px 24px 64px; }
  .eyebrow-row { display:flex; align-items:center; gap:8px; margin-bottom:6px; justify-content:center; }
  .eyebrow-bar { width:32px; height:6px; border-radius:999px; background: var(--red); }
  .eyebrow { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.14em; color: var(--red); }
  h1 { font-size:30px; font-weight:800; color: var(--dark); margin:0 0 8px 0; text-align:center; letter-spacing:-0.01em; }
  .lede { font-size:14px; color: var(--muted); margin: 0 auto 40px; text-align:center; max-width: 520px; line-height:1.5; }

  .carousel-shell { position: relative; }
  .carousel-viewport { overflow:hidden; border-radius: 32px; }
  .carousel-track { display:flex; transition: transform .45s cubic-bezier(.65,0,.35,1); }
  .carousel-slide { flex: 0 0 100%; display:flex; flex-direction:column; align-items:center; padding: 8px 8px 0; }

  .frame-wrap { display:flex; flex-direction:column; align-items:center; gap:20px; width:100%; }
  .device-bezel {
    width: min(620px, 86vw);
    aspect-ratio: 1 / 1;
    border-radius: 34px;
    background: linear-gradient(155deg, #232323 0%, #101010 100%);
    padding: 14px;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,.35), 0 2px 8px rgba(0,0,0,.12);
    position: relative;
  }
  .device-notch {
    position:absolute; top:8px; left:50%; transform:translateX(-50%);
    width:64px; height:6px; border-radius:999px; background:#000; opacity:.55;
  }
  .device-screen {
    width:100%; height:100%; border-radius:22px; overflow:hidden; background:#fff;
    position:relative;
  }
  .device-screen iframe {
    border:0; display:block; transform-origin: top left; background:#fff;
  }

  .slide-caption { text-align:center; max-width: 480px; }
  .slide-num { font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color: var(--red); margin-bottom:4px; }
  .slide-title { font-size:19px; font-weight:800; color: var(--dark); margin:0 0 4px 0; }
  .slide-subtitle { font-size:12.5px; color: var(--muted); margin:0; line-height:1.5; }

  .nav-btn {
    position:absolute; top:50%; transform:translateY(-50%);
    width:46px; height:46px; border-radius:999px; border:1px solid var(--border);
    background:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer;
    box-shadow: 0 6px 18px rgba(0,0,0,.08);
    transition: background .15s, transform .15s;
    z-index: 5;
  }
  .nav-btn:hover { background: var(--dark); }
  .nav-btn:hover svg { stroke:#fff; }
  .nav-btn.prev { left: -6px; }
  .nav-btn.next { right: -6px; }
  @media (min-width: 760px) {
    .nav-btn.prev { left: -54px; }
    .nav-btn.next { right: -54px; }
  }

  .dots { display:flex; align-items:center; justify-content:center; gap:8px; margin-top:28px; }
  .dot { width:8px; height:8px; border-radius:999px; background: var(--border); border:none; padding:0; cursor:pointer; transition: all .2s; }
  .dot.active { width:22px; background: var(--red); }

  .footer-note { font-size:11.5px; text-align:center; margin-top:36px; color: var(--muted); }
  .footer-note a { color: var(--muted); }

  @media (max-width: 480px) {
    h1 { font-size:22px; }
    .lede { font-size:13px; }
  }
</style>
</head>

const NATIVE = 900; // internal iframe canvas size (px, square)

let current = 0;
const track = document.getElementById("track");
const dotsEl = document.getElementById("dots");

function buildSlide(app, index) {
  const slide = document.createElement("div");
  slide.className = "carousel-slide";

  const wrap = document.createElement("div");
  wrap.className = "frame-wrap";

  const bezel = document.createElement("div");
  bezel.className = "device-bezel";

  const notch = document.createElement("div");
  notch.className = "device-notch";
  bezel.appendChild(notch);

  const screen = document.createElement("div");
  screen.className = "device-screen";

  const iframe = document.createElement("iframe");
  iframe.width = NATIVE;
  iframe.height = NATIVE;
  iframe.setAttribute("scrolling", "auto");
  iframe.srcdoc = atob(app.b64);
  screen.appendChild(iframe);
  bezel.appendChild(screen);
  wrap.appendChild(bezel);

  const caption = document.createElement("div");
  caption.className = "slide-caption";
  caption.innerHTML = `
    <div class="slide-num">${index + 1} / ${APPS.length}</div>
    <p class="slide-title">${app.title}</p>
    <p class="slide-subtitle">${app.subtitle}</p>
  `;
  wrap.appendChild(caption);

  slide.appendChild(wrap);
  return { slide, screen, iframe };
}

const refs = APPS.map((app, i) => {
  const built = buildSlide(app, i);
  track.appendChild(built.slide);
  return built;
});

function scaleIframe(ref) {
  const rect = ref.screen.getBoundingClientRect();
  const scale = rect.width / NATIVE;
  ref.iframe.style.transform = `scale(${scale})`;
}

function scaleAll() {
  refs.forEach(scaleIframe);
}

window.addEventListener("resize", scaleAll);
window.addEventListener("load", scaleAll);
// Also run after fonts/layout settle
setTimeout(scaleAll, 50);
setTimeout(scaleAll, 300);

function renderDots() {
  dotsEl.innerHTML = "";
  APPS.forEach((app, i) => {
    const dot = document.createElement("button");
    dot.className = "dot" + (i === current ? " active" : "");
    dot.setAttribute("aria-label", "Go to " + app.title);
    dot.onclick = () => goTo(i);
    dotsEl.appendChild(dot);
  });
}

function goTo(index) {
  current = (index + APPS.length) % APPS.length;
  track.style.transform = `translateX(-${current * 100}%)`;
  renderDots();
  requestAnimationFrame(scaleAll);
}

function nextSlide() { goTo(current + 1); }
function prevSlide() { goTo(current - 1); }

document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") nextSlide();
  if (e.key === "ArrowLeft") prevSlide();
});

// simple touch swipe support
let touchStartX = null;
const viewport = document.querySelector(".carousel-viewport");
viewport.addEventListener("touchstart", (e) => { touchStartX = e.touches[0].clientX; }, { passive: true });
viewport.addEventListener("touchend", (e) => {
  if (touchStartX === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 40) { dx < 0 ? nextSlide() : prevSlide(); }
  touchStartX = null;
}, { passive: true });

renderDots();
goTo(0);
</script>
